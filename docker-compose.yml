version: '3.8'

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ANALYZER_HOST=presidio-analyzer
      - ANONYMIZER_HOST=presidio-anonymizer
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5001:3000"
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5002:3000"
    restart: unless-stopped
